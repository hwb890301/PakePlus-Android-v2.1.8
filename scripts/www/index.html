<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>楼盘推荐助手 · 经纪人版</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
    </script>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #F5F7FA;
            color: #1C1C1E;
            padding: 20px 16px 40px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-container {
            max-width: 720px;
            width: 100%;
        }

        .app-header {
            padding: 12px 0 20px 0;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            border-bottom: 1px solid #E5E5EA;
            margin-bottom: 24px;
        }
        .app-header-left {
            display: flex;
            flex-direction: column;
        }
        .app-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1C1C1E;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-title-icon {
            font-size: 28px;
        }
        .app-subtitle {
            font-size: 13px;
            color: #8E8E93;
            margin-top: 2px;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .app-subtitle .highlight {
            color: #1C1C1E;
            font-weight: 500;
        }
        .app-subtitle .phone-icon {
            display: inline-flex;
            align-items: center;
            line-height: 1;
        }
        .app-subtitle .phone-icon svg {
            width: 18px;
            height: 18px;
            stroke: #1C1C1E;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .app-header-badge {
            background: #007AFF;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .card {
            background: #FFFFFF;
            border-radius: 14px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
            padding: 20px 18px;
            margin-bottom: 18px;
            transition: box-shadow 0.2s ease;
        }
        .card:hover {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #1C1C1E;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.2px;
            flex-wrap: wrap;
        }
        .card-title .badge {
            font-size: 11px;
            font-weight: 500;
            color: #8E8E93;
            background: #F2F2F7;
            padding: 0 10px;
            border-radius: 12px;
            line-height: 20px;
            margin-left: 4px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            margin-bottom: 14px;
        }
        .form-group {
            flex: 1 1 0;
            min-width: 100px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #8E8E93;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #E5E5EA;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            color: #1C1C1E;
            background: #FAFAFC;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #007AFF;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15);
            background: #FFFFFF;
        }
        .form-group input::placeholder {
            color: #C7C7CC;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #F2F2F7;
            color: #1C1C1E;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-primary {
            background: #007AFF;
            color: #fff;
        }
        .btn-primary:hover {
            background: #0066D9;
        }
        .btn-success {
            background: #34C759;
            color: #fff;
        }
        .btn-success:hover {
            background: #2DB84E;
        }
        .btn-danger {
            background: #FF3B30;
            color: #fff;
        }
        .btn-danger:hover {
            background: #E6352B;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #D1D1D6;
            color: #1C1C1E;
        }
        .btn-outline:hover {
            background: #F2F2F7;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 8px;
        }
        .btn-block {
            width: 100%;
            justify-content: center;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 6px;
        }

        /* ===== 匹配结果分类区 ===== */
        .category-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 8px;
        }
        .category-box {
            background: #F8F9FC;
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid #EFEFF4;
            transition: border-color 0.2s;
        }
        .category-box.drag-over {
            border-color: #007AFF;
            background: #F0F5FF;
        }
        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600;
            color: #1C1C1E;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #E5E5EA;
        }
        .category-header .count {
            font-size: 12px;
            font-weight: 400;
            color: #8E8E93;
        }
        .category-list {
            min-height: 40px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .category-list .empty-hint {
            color: #C7C7CC;
            font-size: 13px;
            text-align: center;
            padding: 12px 0;
        }

        /* 匹配楼盘卡片（统一颜色） */
        .match-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #FFFFFF;
            border-radius: 10px;
            border-left: 4px solid #007AFF;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.15s, transform 0.1s;
            cursor: grab;
            flex-wrap: wrap;
            gap: 6px;
        }
        .match-item:active {
            cursor: grabbing;
        }
        .match-item:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .match-item.dragging {
            opacity: 0.4;
            transform: scale(0.98);
        }
        .match-item .info {
            flex: 1;
            min-width: 0;
        }
        .match-item .info .name {
            font-size: 15px;
            font-weight: 600;
            color: #1C1C1E;
        }
        .match-item .info .detail {
            font-size: 12px;
            color: #8E8E93;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            margin-top: 2px;
        }
        .match-item .info .detail .unit-tag {
            background: #F0F0F5;
            border-radius: 10px;
            padding: 0 8px;
            font-size: 11px;
            line-height: 20px;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .match-item .info .detail .unit-tag img {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            object-fit: cover;
        }
        .match-item .remove-btn {
            flex-shrink: 0;
            color: #C7C7CC;
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            transition: color 0.15s;
        }
        .match-item .remove-btn:hover {
            color: #FF3B30;
        }

        .empty-state {
            text-align: center;
            padding: 28px 10px;
            color: #C7C7CC;
            font-size: 14px;
        }
        .empty-state .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
            opacity: 0.5;
        }
        .empty-state .sub {
            font-size: 12px;
            color: #D1D1D6;
            margin-top: 4px;
        }

        /* 手动添加区域 */
        .manual-add-area {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #F0F0F5;
            flex-wrap: wrap;
        }
        .manual-add-area select {
            flex: 2;
            min-width: 160px;
            padding: 8px 12px;
            border: 1px solid #E5E5EA;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: #FAFAFC;
            outline: none;
            color: #1C1C1E;
        }
        .manual-add-area select:focus {
            border-color: #007AFF;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.12);
        }
        .manual-add-area .btn {
            flex-shrink: 0;
        }

        /* ===== 楼盘管理 ===== */
        .building-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .building-list::-webkit-scrollbar {
            width: 4px;
        }
        .building-list::-webkit-scrollbar-thumb {
            background: #D1D1D6;
            border-radius: 8px;
        }
        .building-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #FAFAFC;
            border-radius: 10px;
            font-size: 14px;
            transition: background 0.15s;
            flex-wrap: wrap;
            gap: 6px;
        }
        .building-list-item:hover {
            background: #F2F2F7;
        }
        .building-list-item .info {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            align-items: center;
        }
        .building-list-item .info .name {
            font-weight: 500;
            color: #1C1C1E;
        }
        .building-list-item .info .meta {
            color: #8E8E93;
            font-size: 12px;
        }
        .building-list-item .info .unit-tag {
            background: #E5E5EA;
            border-radius: 10px;
            padding: 0 8px;
            font-size: 11px;
            line-height: 20px;
            color: #1C1C1E;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .building-list-item .del-btn,
        .building-list-item .edit-btn {
            color: #C7C7CC;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 8px;
            border-radius: 6px;
            transition: all 0.15s;
        }
        .building-list-item .del-btn:hover {
            color: #FF3B30;
            background: #FFECEB;
        }
        .building-list-item .edit-btn:hover {
            color: #007AFF;
            background: #E5F0FF;
        }

        /* ===== 编辑模态框 ===== */
        .edit-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 1100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .edit-modal.active {
            display: flex;
        }
        .edit-modal-box {
            background: #FFFFFF;
            border-radius: 20px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 30px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.3s ease;
        }
        .edit-modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid #F0F0F5;
        }
        .edit-modal-box .modal-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: #1C1C1E;
        }
        .edit-modal-box .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #C7C7CC;
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
            transition: color 0.15s;
        }
        .edit-modal-box .modal-close:hover {
            color: #1C1C1E;
        }
        .edit-modal-box .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            border-top: 1px solid #F0F0F5;
            padding-top: 16px;
            flex-wrap: wrap;
        }

        /* ===== 户型表单 (复用) ===== */
        .unit-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            background: #F8F9FC;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #EFEFF4;
        }
        .unit-row .unit-field {
            flex: 1 1 120px;
            min-width: 80px;
        }
        .unit-row .unit-field label {
            font-size: 11px;
            color: #8E8E93;
            display: block;
            margin-bottom: 2px;
        }
        .unit-row .unit-field input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid #E5E5EA;
            border-radius: 8px;
            font-size: 14px;
            background: #FFFFFF;
            outline: none;
        }
        .unit-row .unit-field input:focus {
            border-color: #007AFF;
        }
        .unit-row .unit-field .file-input-wrapper {
            position: relative;
            display: inline-block;
        }
        .unit-row .unit-field .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .unit-row .unit-field .file-input-wrapper .fake-btn {
            background: #F0F0F5;
            border: 1px solid #E5E5EA;
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 12px;
            color: #1C1C1E;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: 0.15s;
        }
        .unit-row .unit-field .file-input-wrapper .fake-btn:hover {
            background: #E5E5EA;
        }
        .unit-row .unit-preview {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .unit-row .unit-preview img {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid #E5E5EA;
        }
        .unit-row .unit-remove {
            color: #FF3B30;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
            line-height: 1;
        }
        .add-unit-btn {
            margin-top: 4px;
            margin-bottom: 12px;
        }

        /* ===== 打印样式 (一页纸) ===== */
        #printArea {
            position: absolute;
            left: -9999px;
            top: 0;
            width: 720px;
            background: #FFFFFF;
            padding: 32px 40px 30px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", serif;
            color: #1C1C1E;
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.08);
            border-radius: 4px;
            z-index: 999;
        }
        #printArea .print-header {
            text-align: center;
            border-bottom: 1px solid #E5E5EA;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        #printArea .print-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #1C1C1E;
        }
        #printArea .print-sub {
            font-size: 13px;
            color: #8E8E93;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }
        #printArea .print-client {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 30px;
            justify-content: center;
            background: #F8F9FC;
            border-radius: 10px;
            padding: 12px 18px;
            margin-bottom: 18px;
            font-size: 13px;
        }
        #printArea .print-client .item {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        #printArea .print-client .label {
            color: #8E8E93;
            font-weight: 400;
        }
        #printArea .print-client .value {
            font-weight: 500;
            color: #1C1C1E;
        }
        #printArea .print-list-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1C1C1E;
            letter-spacing: 0.5px;
        }
        #printArea .print-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #printArea .print-list .item {
            display: flex;
            align-items: flex-start;
            padding: 12px 16px;
            background: #FAFAFC;
            border-radius: 10px;
            border-left: 4px solid #007AFF;
            font-size: 14px;
            flex-wrap: wrap;
        }
        #printArea .print-list .item .info {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
            align-items: center;
            flex: 1;
        }
        #printArea .print-list .item .info .name {
            font-weight: 600;
            font-size: 15px;
        }
        #printArea .print-list .item .info .meta {
            color: #8E8E93;
            font-size: 13px;
        }
        #printArea .print-list .item .info .slogan {
            font-size: 13px;
            color: #1C1C1E;
            background: #E8F0FE;
            border-radius: 8px;
            padding: 2px 12px;
            line-height: 24px;
            display: inline-block;
        }
        #printArea .print-list .item .info .unit-print {
            background: #F0F0F5;
            border-radius: 12px;
            padding: 6px 16px;
            font-size: 14px;
            line-height: 34px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        #printArea .print-list .item .info .unit-print img {
            width: 64px;
            height: 64px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #D1D1D6;
        }
        #printArea .print-list .item .info .unit-text {
            background: #F0F0F5;
            border-radius: 12px;
            padding: 2px 12px;
            font-size: 13px;
            line-height: 26px;
            color: #8E8E93;
            display: inline-block;
        }
        #printArea .print-list .item .info .other-prefix {
            font-size: 13px;
            color: #8E8E93;
            font-weight: 400;
            margin-right: 4px;
        }
        #printArea .print-list .item .info .tag-print {
            font-size: 11px;
            font-weight: 500;
            padding: 0 12px;
            border-radius: 12px;
            background: #8E8E93;
            color: #fff;
            line-height: 20px;
            letter-spacing: 0.3px;
        }
        #printArea .print-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #8E8E93;
            border-top: 1px solid #F0F0F5;
            padding-top: 14px;
            letter-spacing: 0.5px;
        }
        #printArea .print-footer .highlight {
            color: #1C1C1E;
            font-weight: 500;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #FFFFFF;
            border-radius: 20px;
            max-width: 760px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 28px 30px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.3s ease;
        }
        .modal-box::-webkit-scrollbar {
            width: 4px;
        }
        .modal-box::-webkit-scrollbar-thumb {
            background: #D1D1D6;
            border-radius: 8px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid #F0F0F5;
        }
        .modal-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: #1C1C1E;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: #C7C7CC;
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
            transition: color 0.15s;
        }
        .modal-close:hover {
            color: #1C1C1E;
        }
        .modal-body {

        /* ===== 响应式 ===== */

            body {

            #printArea {

            #printArea .print-client {

    <script>
        // ================================================================
        //  1. 数据库层 (IndexedDB)
        // ================================================================
        const DB_NAME = 'EstateRecommendDB';
        const DB_VERSION = 7;
        const STORE_BUILDINGS = 'buildings';

        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains(STORE_BUILDINGS)) {
                        d.createObjectStore(STORE_BUILDINGS, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = (e) => {
                    reject(e.target.error);
                };
            });
        }

        function dbPut(storeName, data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.put(data);
                req.onsuccess = () => resolve(data);
                req.onerror = () => reject(req.error);
            });
        }

        function dbDelete(storeName, id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const req = store.delete(id);
                req.onsuccess = () => resolve(id);
                req.onerror = () => reject(req.error);
            });
        }

        function dbGetAll(storeName) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        // ================================================================
        //  2. 数据管理
        // ================================================================
        let buildings = [];
        let matchCategories = {
            '首选': [],
            '次选': [],
            '可参考': []
        };
        let clientInfo = { name: '', budget: '', area: '' };
        let tempUnits = []; // 用于添加/编辑的临时户型数组
        let editingBuildingId = null; // 正在编辑的楼盘ID

        function genId() {
            return Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 4);
        }

        async function loadBuildings() {
            try {
                buildings = await dbGetAll(STORE_BUILDINGS);
                return buildings;
            } catch (e) {
                console.warn('加载楼盘失败', e);
                buildings = [];
                return [];
            }
        }

        async function saveBuilding(data) {
            if (!data.id) data.id = genId();
            if (!Array.isArray(data.units)) data.units = [];
            data.metro = data.metro || '';
            data.school = data.school || '';
            data.slogan = data.slogan || '';
            await dbPut(STORE_BUILDINGS, data);
            await loadBuildings();
            return data;
        }

        async function removeBuilding(id) {
            await dbDelete(STORE_BUILDINGS, id);
            await loadBuildings();
            for (const cat of Object.keys(matchCategories)) {
                matchCategories[cat] = matchCategories[cat].filter(bid => bid !== id);
            }
            renderMatches();
            updateCount();
            populateManualSelect();
            renderBuildingManager();
        }

        function getBuilding(id) {
            return buildings.find(b => b.id === id);
        }

        // ================================================================
        //  3. 匹配逻辑
        // ================================================================
        function autoMatch(budget) {
            if (!budget) return [];
            const b = parseFloat(budget);
            if (isNaN(b) || b <= 0) return [];
            const priceLow = b;
            const priceHigh = b + 100;
            const matchedIds = [];
            for (const building of buildings) {
                if (!building.units || building.units.length === 0) continue;
                let matched = false;
                for (const unit of building.units) {
                    const uPrice = parseFloat(unit.price);
                    if (isNaN(uPrice) || uPrice <= 0) continue;
                    if (uPrice >= priceLow && uPrice <= priceHigh) {
                        matched = true;
                        break;
                    }
                }
                if (matched) matchedIds.push(building.id);
            }
            return matchedIds;
        }

        // ================================================================
        //  4. UI 渲染
        // ================================================================

        function renderMatches() {
            const container = document.getElementById('categoryContainer');
            const categories = ['首选', '次选', '可参考'];
            let html = '';
            for (const cat of categories) {
                const ids = matchCategories[cat] || [];
                const count = ids.length;
                html += `
                    <div class="category-box" data-category="${cat}">
                        <div class="category-header">
                            <span>${cat} <span class="count">(${count})</span></span>
                        </div>
                        <div class="category-list" data-category="${cat}">
                            ${ids.length === 0 ? '<div class="empty-hint">— 暂无楼盘 —</div>' : ''}
                            ${ids.map(id => {
                                const b = getBuilding(id);
                                if (!b) return '';
                                return renderMatchItem(b, cat);
                            }).join('')}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;

            container.querySelectorAll('.category-list').forEach(list => {
                list.addEventListener('dragover', onDragOver);
                list.addEventListener('drop', onDrop);
            });

            container.querySelectorAll('.match-item').forEach(item => {
                item.addEventListener('dragstart', onDragStart);
                item.addEventListener('dragend', onDragEnd);
                const removeBtn = item.querySelector('.remove-btn');
                if (removeBtn) {
                    removeBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        removeFromAllCategories(id);
                    });
                }
            });

            updateCount();
            populateManualSelect();
            saveMatchCategories();
        }

        function renderMatchItem(building, category) {
            let unitsHtml = '';
            if (building.units && building.units.length) {
                for (const u of building.units) {
                    const img = u.image ? `<img src="${u.image}" alt="户型" />` : '';
                    unitsHtml += `<span class="unit-tag">${img}${u.area}㎡·${u.price}万</span>`;
                }
            } else {
                unitsHtml = '<span class="unit-tag">无户型</span>';
            }
            const metro = building.metro ? `🚇 ${building.metro}` : '';
            const school = building.school ? `🏫 ${building.school}` : '';
            const extra = [metro, school].filter(Boolean).join(' · ');
            return `
                <div class="match-item" draggable="true" data-id="${building.id}" data-category="${category}">
                    <div class="info">
                        <div class="name">${building.name || '未命名'}</div>
                        <div class="detail">
                            <span>📍 ${building.location || '未填'}</span>
                            ${extra ? `<span>${extra}</span>` : ''}
                            ${unitsHtml}
                        </div>
                    </div>
                    <button class="remove-btn" data-id="${building.id}" title="移除">✕</button>
                </div>
            `;
        }

        function updateCount() {
            let total = 0;
            for (const cat of Object.keys(matchCategories)) {
                total += matchCategories[cat].length;
            }
            document.getElementById('resultCount').textContent = total + ' 个楼盘';
        }

        function populateManualSelect() {
            const sel = document.getElementById('manualSelect');
            const allMatched = [];
            for (const cat of Object.keys(matchCategories)) {
                allMatched.push(...matchCategories[cat]);
            }
            const available = buildings.filter(b => !allMatched.includes(b.id));
            sel.innerHTML = '<option value="">— 选择楼盘手动添加 —</option>';
            for (const b of available) {
                const opt = document.createElement('option');
                opt.value = b.id;
                const unitInfo = b.units && b.units.length ? b.units.map(u => `${u.area}㎡/${u.price}万`).join(' ') :
                    '无户型';
                opt.textContent = `${b.name} (${b.location || '位置未填'}) ${unitInfo}`;
                sel.appendChild(opt);
            }
            if (available.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '— 无可添加的楼盘 —';
                sel.appendChild(opt);
            }
        }

        function removeFromAllCategories(id) {
            let removed = false;
            for (const cat of Object.keys(matchCategories)) {
                const idx = matchCategories[cat].indexOf(id);
                if (idx !== -1) {
                    matchCategories[cat].splice(idx, 1);
                    removed = true;
                }
            }
            if (removed) {
                renderMatches();
                showToast('已移除该楼盘');
            }
        }

        // ================================================================
        //  5. 拖拽逻辑
        // ================================================================

        let dragData = null;

        function onDragStart(e) {
            const item = e.target.closest('.match-item');
            if (!item) return;
            dragData = {
                id: item.dataset.id,
                fromCategory: item.dataset.category,
                element: item
            };
            item.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', item.dataset.id);
        }

        function onDragEnd(e) {
            const item = e.target.closest('.match-item');
            if (item) item.classList.remove('dragging');
            document.querySelectorAll('.category-box').forEach(box => box.classList.remove('drag-over'));
        }

        function onDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const box = e.target.closest('.category-box');
            if (box) {
                box.classList.add('drag-over');
            }
        }

        function onDrop(e) {
            e.preventDefault();
            const targetList = e.target.closest('.category-list');
            if (!targetList) return;
            const targetCategory = targetList.dataset.category;
            if (!targetCategory) return;
            const id = e.dataTransfer.getData('text/plain');
            if (!id) return;
            const draggedItem = document.querySelector(`.match-item[data-id="${id}"]`);
            if (!draggedItem) return;
            let found = false;
            for (const cat of Object.keys(matchCategories)) {
                const idx = matchCategories[cat].indexOf(id);
                if (idx !== -1) {
                    matchCategories[cat].splice(idx, 1);
                    found = true;
                    break;
                }
            }
            if (!found) return;
            if (!matchCategories[targetCategory]) matchCategories[targetCategory] = [];
            const dropTarget = e.target.closest('.match-item');
            if (dropTarget && dropTarget.dataset.id !== id) {
                const targetId = dropTarget.dataset.id;
                const idx = matchCategories[targetCategory].indexOf(targetId);
                if (idx !== -1) {
                    matchCategories[targetCategory].splice(idx, 0, id);
                } else {
                    matchCategories[targetCategory].push(id);
                }
            } else {
                matchCategories[targetCategory].push(id);

            renderMatches();

        // ================================================================

        // ================================================================

        function buildPrintContent() {
            const area = document.getElementById('printArea');
            const name = clientInfo.name || '未填写';
            const budget = clientInfo.budget || '--';
            const areaReq = clientInfo.area || '--';
            const budgetNum = parseFloat(clientInfo.budget);
            const isValidBudget = !isNaN(budgetNum) && budgetNum > 0;

            const categories = ['首选', '次选', '可参考'];
            let allIds = [];
            for (const cat of categories) {
                allIds = allIds.concat(matchCategories[cat] || []);
            }

            let listHtml = '';
            if (allIds.length === 0) {
                listHtml = `
                    <div style="text-align:center;padding:30px 0;color:#C7C7CC;font-size:14px;">
                        暂无推荐楼盘，请先完成匹配。
                    </div>
                `;
            } else {
                for (const id of allIds) {
                    const b = getBuilding(id);
                    if (!b) continue;
                    let allUnits = b.units || [];
                    if (allUnits.length === 0) continue;

                    let category = '其他';
                    for (const cat of categories) {
                        if ((matchCategories[cat] || []).includes(id)) {
                            category = cat;
                            break;
                        }
                    }
                    const tag = `<span class="tag-print" style="background:#8E8E93;">${category}</span>`;

                    const matchedUnits = [];
                    const otherUnits = [];
                    for (const u of allUnits) {
                        const uPrice = parseFloat(u.price);
                        const isMatched = isValidBudget && !isNaN(uPrice) && uPrice >= budgetNum && uPrice <= budgetNum + 100;
                        if (isMatched) {
                            matchedUnits.push(u);
                        } else {
                            otherUnits.push(u);
                        }
                    }

                    let unitsPrint = '';
                    for (const u of matchedUnits) {
                        const img = u.image ? `<img src="${u.image}" alt="户型图" />` : '';
                        unitsPrint +=
                            `<span class="unit-print">${img} ${u.area}㎡ · ${u.price}万</span>`;
                    }
                    if (otherUnits.length > 0) {
                        unitsPrint += `<span class="other-prefix">其他在售户型：</span>`;
                        for (const u of otherUnits) {
                            unitsPrint += `<span class="unit-text">${u.area}㎡ · ${u.price}万</span>`;
                        }
                    }

                    const metroText = b.metro ? `🚇 ${b.metro}` : '';
                    const schoolText = b.school ? `🏫 ${b.school}` : '';
                    const extra = [metroText, schoolText].filter(Boolean).join(' · ');
                    const sloganHtml = b.slogan ? `<span class="slogan">✨ ${b.slogan}</span>` : '';

                    listHtml += `
                        <div class="item">
                            <div class="info">
                                <span class="name">${b.name || '未命名'}</span>
                                ${tag}
                                ${sloganHtml}
                                <span class="meta">📍 ${b.location || '位置未填'}</span>
                                ${extra ? `<span class="meta">${extra}</span>` : ''}
                                ${unitsPrint}
                            </div>
                        </div>
                    `;
                }
            }

            if (listHtml.trim() === '') {
                listHtml = `
                    <div style="text-align:center;padding:30px 0;color:#C7C7CC;font-size:14px;">
                        暂无符合预算的户型推荐，请调整预算或添加更多楼盘。
                    </div>
                `;
            }

            const now = new Date();
            const dateStr = now.getFullYear() + '年' +
                String(now.getMonth() + 1).padStart(2, '0') + '月' +
                String(now.getDate()).padStart(2, '0') + '日';

            area.innerHTML = `
                <div class="print-header">
                    <div class="print-title">推荐楼盘参考</div>
                    <div class="print-sub">定制专属于您的置业计划</div>
                </div>
                <div class="print-client">
                    <div class="item"><span class="label">客户姓名：</span><span class="value">${name}</span></div>
                    <div class="item"><span class="label">预算范围：</span><span class="value">${budget} 万元</span></div>
                    <div class="item"><span class="label">需求面积：</span><span class="value">${areaReq} ㎡</span></div>
                    <div class="item"><span class="label">销售顾问：</span><span class="value">刘娜 📞 15822457154</span></div>
                    <div class="item"><span class="label">推荐日：</span><span class="value">${dateStr}</span></div>
                </div>
                <div class="print-list-title">📌 推荐楼盘（${allIds.filter(id => {
                    const b = getBuilding(id);
                    return b && b.units && b.units.length > 0;
                }).length} 个）</div>
                <div class="print-list">
                    ${listHtml}
                </div>
                <div class="print-footer">
                    <span>价格以到访日价格为准，推荐价格为均价，仅供参考</span>
                </div>
            `;
        }

        // ================================================================
        //  10. 保存图片功能 (下载 + 分享)
        // ================================================================

        async function generateImageBlob() {
            const printArea = document.getElementById('printArea');
            buildPrintContent();
            const canvas = await html2canvas(printArea, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#FFFFFF',
                logging: false,
                width: 720,
                height: printArea.scrollHeight,
            });
            return new Promise((resolve) => {
                canvas.toBlob((blob) => {
                    resolve({ blob, canvas });
                }, 'image/png');
            });
        }

        async function downloadImage() {
            showToast('⏳ 正在生成图片...');
            try {
                const { blob, canvas } = await generateImageBlob();
                const link = document.createElement('a');
                link.download = `推荐指南_${clientInfo.name || '客户'}_${new Date().toISOString().slice(0,10)}.png`;
                link.href = URL.createObjectURL(blob);
                link.click();
                URL.revokeObjectURL(link.href);
                showToast('✅ 图片已下载！');
            } catch (err) {
                console.error(err);
                showToast('❌ 生成失败，请重试');
            }
        }

        async function shareImage() {
            // 检查是否支持分享API
            if (!navigator.share) {
                // 如果不支持，降级为下载
                showToast('⚠️ 当前浏览器不支持分享，将转为下载');
                await downloadImage();
                return;
            }
            showToast('⏳ 正在准备分享...');
            try {
                const { blob } = await generateImageBlob();
                const file = new File([blob], `推荐指南_${clientInfo.name || '客户'}.png`, { type: 'image/png' });
                await navigator.share({
                    title: '楼盘推荐指南',
                    files: [file]
                });
                showToast('✅ 分享成功！');
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error(err);
                    showToast('❌ 分享失败，请尝试下载');
                } else {
                    showToast('已取消分享');
                }
            }
        }

        // ================================================================

        // ================================================================

        function saveMatchCategories() {
            try {
                localStorage.setItem('matchCategories', JSON.stringify(matchCategories));
            } catch (e) {}
        }

        function loadMatchCategories() {
            try {
                const saved = localStorage.getItem('matchCategories');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    for (const cat of ['首选', '次选', '可参考']) {
                        if (!parsed[cat]) parsed[cat] = [];
                    }
                    matchCategories = parsed;
                } else {
                    matchCategories = { '首选': [], '次选': [], '可参考': [] };
                }
            } catch (e) {
                matchCategories = { '首选': [], '次选': [], '可参考': [] };
            }
        }

                }

                loadMatchCategories();

                const savedClient = localStorage.getItem('clientInfo');
                if (savedClient) {
                    try {
                        const c = JSON.parse(savedClient);
                        clientInfo = c;
                        document.getElementById('clientName').value = c.name || '';
                        document.getElementById('clientBudget').value = c.budget || '';
                        document.getElementById('clientArea').value = c.area || '';
                    } catch (e) {}
                }

                renderMatches();
                populateManualSelect();
                renderBuildingManager();
                renderUnitRows();

            } catch (e) {
                console.error('初始化失败', e);
                showToast('⚠️ 数据加载失败，请刷新重试');
            }

            // ---- 事件绑定 ----

            document.getElementById('btnAutoMatch').addEventListener('click', function() {
                const name = document.getElementById('clientName').value.trim();
                const budget = document.getElementById('clientBudget').value.trim();
                const area = document.getElementById('clientArea').value.trim();

                if (!name) { showToast('⚠️ 请填写客户姓名'); return; }
                if (!budget) { showToast('⚠️ 请填写预算'); return; }

                clientInfo = { name, budget, area };
                localStorage.setItem('clientInfo', JSON.stringify(clientInfo));

                const matchedIds = autoMatch(budget);
                matchCategories = { '首选': [], '次选': [], '可参考': [] };
                matchCategories['首选'] = matchedIds;
                renderMatches();
                saveMatchCategories();

                const count = matchedIds.length;
                showToast(`✅ 自动匹配完成，共 ${count} 个楼盘`);
                if (count === 0) {
                    showToast('⚠️ 没有找到匹配的楼盘，请调整预算或手动添加');
                }
            });

            document.getElementById('btnManualAdd').addEventListener('click', function() {
                const sel = document.getElementById('manualSelect');
                const id = sel.value;
                if (!id) { showToast('⚠️ 请先选择一个楼盘'); return; }
                let exists = false;
                for (const cat of Object.keys(matchCategories)) {
                    if (matchCategories[cat].includes(id)) { exists = true; break; }
                }
                if (exists) {
                    showToast('⚠️ 该楼盘已在列表中');
                    return;
                }
                matchCategories['首选'].push(id);
                renderMatches();
                saveMatchCategories();
                showToast('✅ 已手动添加楼盘');
            });

            document.getElementById('btnClearMatch').addEventListener('click', function() {
                let total = 0;
                for (const cat of Object.keys(matchCategories)) {
                    total += matchCategories[cat].length;
                }
                if (total === 0) {
                    showToast('⚠️ 当前没有匹配结果');
                    return;
                }
                matchCategories = { '首选': [], '次选': [], '可参考': [] };
                renderMatches();
                saveMatchCategories();
                showToast('🗑 已清空所有匹配结果');
            });

            document.getElementById('btnClearAll').addEventListener('click', function() {
                if (!confirm('确定要清空所有数据吗？（客户信息 + 匹配结果）')) return;
                document.getElementById('clientName').value = '';
                document.getElementById('clientBudget').value = '';
                document.getElementById('clientArea').value = '';
                clientInfo = { name: '', budget: '', area: '' };
                localStorage.removeItem('clientInfo');
                matchCategories = { '首选': [], '次选': [], '可参考': [] };
                renderMatches();
                saveMatchCategories();
                showToast('🗑 已清空所有');
            });

            document.getElementById('btnGenerate').addEventListener('click', function() {
                let total = 0;
                for (const cat of Object.keys(matchCategories)) {
                    total += matchCategories[cat].length;
                }
                if (total === 0) {
                    showToast('⚠️ 请先匹配至少一个楼盘');
                    return;
                }
                if (!clientInfo.name) {
                    showToast('⚠️ 请填写客户姓名');
                    return;
                }
                showPreviewModal();
            });

            document.getElementById('modalClose').addEventListener('click', hidePreviewModal);
            document.getElementById('modalCancel').addEventListener('click', hidePreviewModal);
            document.getElementById('previewModal').addEventListener('click', function(e) {
                if (e.target === this) hidePreviewModal();
            });

            document.getElementById('modalSaveImage').addEventListener('click', async function() {
                await downloadImage();
            });

            document.getElementById('modalShareImage').addEventListener('click', async function() {
                await shareImage();
            });

            document.getElementById('btnViewBuildings').addEventListener('click', function() {
                const mgr = document.getElementById('buildingManager');
                if (mgr.style.display === 'none') {
                    mgr.style.display = 'block';
                    renderBuildingManager();
                    populateManualSelect();
                    this.textContent = '📋 收起楼盘';
                } else {
                    mgr.style.display = 'none';
                    this.textContent = '📋 管理楼盘';
                }
            });

            document.getElementById('btnCloseManager').addEventListener('click', function() {
                document.getElementById('buildingManager').style.display = 'none';
                document.getElementById('btnViewBuildings').textContent = '📋 管理楼盘';
            });

            document.querySelectorAll('#clientName, #clientBudget, #clientArea').forEach(inp => {
                inp.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        document.getElementById('btnAutoMatch').click();
                    }
                });
            });

            window.addEventListener('beforeunload', function() {
                saveMatchCategories();
            });

            console.log('🏠 楼盘推荐助手 v2.0 已启动！');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
