<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>✨ 小祖宗の许愿单</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
    </script>
    <style>
        /* ===== CSS Variables & Reset ===== */
        :root {
            --bg-main: #eef6ef;
            --bg-card: #ffffff;
            --bg-sidebar: #f8fbf9;
            --primary: #6ba88e;
            --primary-light: #8cc4ab;
            --primary-dark: #4f8a72;
            --text-primary: #2d3e35;
            --text-secondary: #6a7f74;
            --text-light: #a0b5a8;
            --shadow: 0 4px 20px rgba(107, 168, 142, 0.15);
            --radius: 18px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font);
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .app {
            width: 100%;
            max-width: 430px;
            height: 92vh;
            max-height: 820px;
            background: var(--bg-main);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid rgba(107, 168, 142, 0.12);
        }

        .topbar {
            background: var(--bg-main);
            padding: 16px 20px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(107, 168, 142, 0.08);
            position: relative;
            z-index: 10;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--bg-card);
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(107, 168, 142, 0.08);
            transition: var(--transition);
            color: var(--text-primary);
            font-family: var(--font);
        }

        .menu-btn:active {
            transform: scale(0.92);
        }

        .topbar-title {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: var(--text-primary);
            font-family: 'Patrick Hand', 'Comic Sans MS', cursive, var(--font);
        }

        .topbar-title span {
            color: var(--primary);
        }

        .cart-btn-wrap {
            position: relative;
        }

        .cart-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--bg-card);
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(107, 168, 142, 0.08);
            transition: var(--transition);
            color: var(--text-primary);
            font-family: var(--font);
        }

        .cart-btn:active {
            transform: scale(0.92);
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #e74c5e;
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(231, 76, 94, 0.3);
            transition: var(--transition);
            opacity: 0;
            transform: scale(0.5);
            font-family: var(--font);
        }

        .cart-badge.show {
            opacity: 1;
            transform: scale(1);
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 10px;
            -webkit-overflow-scrolling: touch;
        }

        .main-content::-webkit-scrollbar {
            width: 3px;
        }
        .main-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .main-content::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .category-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            font-family: var(--font);
        }

        .category-header h2 .emoji {
            margin-right: 8px;
        }

        .add-item-btn {
            background: var(--bg-card);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(107, 168, 142, 0.1);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font);
        }

        .add-item-btn:active {
            transform: scale(0.88);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .empty-state .big-emoji {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        .empty-state p {
            font-size: 15px;
            line-height: 1.6;
            font-family: var(--font);
        }

        .item-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding-bottom: 8px;
        }

        .item-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(107, 168, 142, 0.08);
            transition: var(--transition);
            position: relative;
            cursor: default;
            animation: cardIn 0.35s ease forwards;
        }

        .item-card:active {
            transform: scale(0.97);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .item-card .card-img {
            width: 100%;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            background: #e8f3ed;
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .item-card .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-card .card-img .emoji-placeholder {
            font-size: 52px;
            line-height: 1;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .item-card .card-body {
            padding: 10px 12px 12px;
        }

        .item-card .card-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: var(--font);
        }

        .item-card .card-address {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: var(--font);
        }

        .item-card .card-address::before {
            content: "📍";
            font-size: 10px;
        }

        .item-card .card-actions {
            display: flex;
            justify-content: flex-end;
        }

        .item-card .add-to-cart {
            background: var(--primary);
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(107, 168, 142, 0.25);
            font-family: var(--font);
        }

        .item-card .add-to-cart:active {
            transform: scale(0.85);
        }

        .item-card .add-to-cart.added {
            background: #e8f3ed;
            color: var(--primary);
            box-shadow: none;
        }

        .item-card .card-img .img-upload-btn {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            border: none;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: var(--transition);
            font-family: var(--font);
        }

        .item-card .card-img .img-upload-btn:active {
            transform: scale(0.88);
        }

        .item-card .card-img .img-upload-btn input {
            display: none;
        }

        .sidebar-overlay {
            position: absolute;
            inset: 0;
            background: rgba(45, 62, 53, 0.3);
            backdrop-filter: blur(6px);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        .sidebar-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            max-width: 78%;
            background: var(--bg-sidebar);
            z-index: 60;
            transform: translateX(-100%);
            transition: var(--transition);
            padding: 24px 20px 20px;
            display: flex;
            flex-direction: column;
            border-radius: 0 var(--radius) var(--radius) 0;
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.06);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-close {
            align-self: flex-end;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px;
            margin-bottom: 8px;
            font-family: var(--font);
        }

        .sidebar-close:active {
            transform: scale(0.85);
        }

        .sidebar-title {
            font-size: 22px;
            font-weight: 400;
            margin-bottom: 24px;
            color: var(--text-primary);
            padding-left: 4px;
            font-family: 'Patrick Hand', 'Comic Sans MS', cursive, var(--font);
            letter-spacing: 0.5px;
        }

        .sidebar-title small {
            font-weight: 400;
            font-size: 13px;
            color: var(--text-light);
            display: block;
            margin-top: 2px;
            font-family: var(--font);
        }

        .sidebar-categories {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-cat {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            text-align: left;
            font-family: var(--font);
        }

        .sidebar-cat .cat-emoji {
            font-size: 22px;
        }

        .sidebar-cat:active {
            transform: scale(0.96);
        }

        .sidebar-cat.active {
            background: var(--bg-card);
            color: var(--primary);
            box-shadow: 0 2px 12px rgba(107, 168, 142, 0.08);
            font-weight: 600;
        }

        .sidebar-cat .cat-count {
            margin-left: auto;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-light);
            background: var(--bg-main);
            padding: 2px 10px;
            border-radius: 20px;
            font-family: var(--font);
        }

        .sidebar-cat.active .cat-count {
            background: var(--primary-light);
            color: #fff;
        }

        .sidebar-footer {
            border-top: 1px solid rgba(107, 168, 142, 0.08);
            padding-top: 16px;
            margin-top: 4px;
        }

        .sidebar-add-cat {
            width: 100%;
            padding: 12px 16px;
            border: 2px dashed rgba(107, 168, 142, 0.2);
            border-radius: var(--radius-sm);
            background: transparent;
            font-size: 15px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: var(--font);
        }

        .sidebar-add-cat:active {
            transform: scale(0.96);
        }
        .sidebar-add-cat.solid {
            border-style: solid;
            border-color: var(--primary-light);
            background: var(--bg-card);
        }

        .cart-modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(45, 62, 53, 0.35);
            backdrop-filter: blur(8px);
            z-index: 70;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            padding: 20px;
        }

        .cart-modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .cart-modal {
            background: var(--bg-card);
            border-radius: var(--radius);
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            transform: scale(0.92) translateY(20px);
            transition: var(--transition);
            overflow: hidden;
        }

        .cart-modal-overlay.open .cart-modal {
            transform: scale(1) translateY(0);
        }

        .cart-modal-header {
            padding: 18px 20px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(107, 168, 142, 0.06);
            flex-shrink: 0;
        }

        .cart-modal-header h3 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
        }

        .cart-modal-header h3 .count {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-light);
            background: var(--bg-main);
            padding: 0 12px;
            border-radius: 20px;
            font-family: var(--font);
        }

        .cart-close-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-light);
            padding: 4px;
            font-family: var(--font);
        }

        .cart-close-btn:active {
            transform: scale(0.85);
        }

        .cart-list-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 8px;
            -webkit-overflow-scrolling: touch;
        }

        .cart-list-wrap::-webkit-scrollbar {
            width: 3px;
        }
        .cart-list-wrap::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: var(--bg-main);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            animation: cardIn 0.25s ease forwards;
        }

        .cart-item .ci-emoji {
            font-size: 28px;
            width: 40px;
            text-align: center;
            flex-shrink: 0;
        }

        .cart-item .ci-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item .ci-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            font-family: var(--font);
        }

        .cart-item .ci-addr {
            font-size: 11px;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: var(--font);
        }

        .cart-item .ci-remove {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            transition: var(--transition);
            font-family: var(--font);
        }

        .cart-item .ci-remove:active {
            transform: scale(0.85);
            color: #e74c5e;
        }

        .cart-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .cart-empty .big-emoji {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }

        .cart-empty p {
            font-family: var(--font);
            font-size: 15px;
        }

        .cart-modal-footer {
            padding: 14px 20px 18px;
            border-top: 1px solid rgba(107, 168, 142, 0.06);
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        .cart-modal-footer .btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: var(--font);
        }

        .cart-modal-footer .btn:active {
            transform: scale(0.96);
        }

        .btn-cancel {
            background: var(--bg-main);
            color: var(--text-secondary);
        }

        .btn-confirm {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 16px rgba(107, 168, 142, 0.3);
        }

        .btn-confirm:active {
            box-shadow: 0 2px 8px rgba(107, 168, 142, 0.2);
        }

        .add-modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(45, 62, 53, 0.35);
            backdrop-filter: blur(8px);
            z-index: 80;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            padding: 20px;
        }

        .add-modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .add-modal {
            background: var(--bg-card);
            border-radius: var(--radius);
            width: 100%;
            max-width: 380px;
            padding: 24px 22px 22px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            transform: scale(0.92) translateY(20px);
            transition: var(--transition);
        }

        .add-modal-overlay.open .add-modal {
            transform: scale(1) translateY(0);
        }

        .add-modal h3 {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font);
        }

        .add-modal .field {
            margin-bottom: 14px;
        }

        .add-modal .field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-family: var(--font);
        }

        .add-modal .field input,
        .add-modal .field textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid rgba(107, 168, 142, 0.12);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: var(--font);
            transition: var(--transition);
            background: var(--bg-main);
            color: var(--text-primary);
        }

        .add-modal .field input:focus,
        .add-modal .field textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-card);
            box-shadow: 0 0 0 4px rgba(107, 168, 142, 0.08);
        }

        .add-modal .field textarea {
            resize: vertical;
            min-height: 44px;
        }

        .add-modal .field .emoji-picker {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            padding: 6px 0 2px;
        }

        .add-modal .field .emoji-picker button {
            width: 40px;
            height: 40px;
            border: 2px solid transparent;
            border-radius: 50%;
            font-size: 22px;
            background: var(--bg-main);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .add-modal .field .emoji-picker button:active {
            transform: scale(0.88);
        }

        .add-modal .field .emoji-picker button.selected {
            border-color: var(--primary);
            background: var(--bg-card);
            box-shadow: 0 2px 8px rgba(107, 168, 142, 0.12);
        }

        .add-modal .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        .add-modal .modal-actions .btn {
            flex: 1;
            padding: 11px 0;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font);
        }

        .add-modal .modal-actions .btn:active {
            transform: scale(0.96);
        }

        .toast {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text-primary);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            white-space: nowrap;
            font-family: var(--font);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .screenshot-preview-overlay {
            position: absolute;
            inset: 0;
            background: rgba(45, 62, 53, 0.5);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
            padding: 20px;
        }

        .screenshot-preview-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .screenshot-preview {
            background: var(--bg-card);
            border-radius: var(--radius);
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            transform: scale(0.92) translateY(20px);
            transition: var(--transition);
            padding: 16px;
        }

        .screenshot-preview-overlay.open .screenshot-preview {
            transform: scale(1) translateY(0);
        }

        .screenshot-preview img {
            width: 100%;
            height: auto;
            border-radius: var(--radius-sm);
            display: block;
        }

        .screenshot-preview .preview-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .screenshot-preview .preview-actions .btn {
            flex: 1;
            padding: 11px 0;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            font-family: var(--font);
        }

        .screenshot-preview .preview-actions .btn:active {
            transform: scale(0.96);
        }

        .btn-download {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 16px rgba(107, 168, 142, 0.25);
        }

        .btn-close-preview {
            background: var(--bg-main);
            color: var(--text-secondary);
        }

        .main-content::-webkit-scrollbar,
        .cart-list-wrap::-webkit-scrollbar,
        .screenshot-preview::-webkit-scrollbar {
            width: 3px;
        }

        .main-content::-webkit-scrollbar-thumb,
        .cart-list-wrap::-webkit-scrollbar-thumb,
        .screenshot-preview::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
            }
            .app {
                max-height: 100vh;
                height: 100vh;
                border-radius: 0;
                border: none;
                max-width: 100%;
            }
            .sidebar {
                border-radius: 0 var(--radius) var(--radius) 0;
            }
            .item-grid {
                gap: 10px;
            }
            .item-card .card-body {
                padding: 8px 10px 10px;
            }
            .item-card .card-name {
                font-size: 13px;
            }
            .cart-modal {
                max-height: 90vh;
            }
        }

        @media (min-width: 600px) {
            .app {
                max-width: 460px;
                height: 88vh;
            }
            .item-grid {
                gap: 16px;
            }
        }

        .hidden {
            display: none !important;
        }

        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-cat .cat-del {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 14px;
            cursor: pointer;
            padding: 0 6px;
            opacity: 0.4;
            transition: var(--transition);
            font-family: var(--font);
        }

        .sidebar-cat:hover .cat-del {
            opacity: 0.8;
        }

        .sidebar-cat .cat-del:active {
            transform: scale(0.85);
            color: #e74c5e;
        }

        .item-card .card-del {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-light);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            opacity: 0;
            font-family: var(--font);
        }

        .item-card:hover .card-del {
            opacity: 0.6;
        }

        .item-card .card-del:active {
            transform: scale(0.85);
            color: #e74c5e;
            opacity: 1;
        }

        @media (max-width: 480px) {
            .item-card .card-del {
                opacity: 0.4;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- ===== Top Bar ===== -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-btn" id="menuBtn" aria-label="菜单">☰</button>
                <span class="topbar-title">✨ 小祖宗の<span>许愿单</span></span>
            </div>
            <div class="cart-btn-wrap">
                <button class="cart-btn" id="cartBtn" aria-label="购物清单">🛒</button>
                <span class="cart-badge" id="cartBadge">0</span>
            </div>
        </header>

        <!-- ===== Main Content ===== -->
        <main class="main-content" id="mainContent">
            <!-- 动态渲染 -->
        </main>

        <!-- ===== Sidebar ===== -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <nav class="sidebar" id="sidebar">
            <button class="sidebar-close" id="sidebarClose">✕</button>
            <div class="sidebar-title">
                ✨ 仙女请下单
                <small>点击切换 · 点击 ✕ 删除</small>
            </div>
            <div class="sidebar-categories" id="sidebarCategories">
                <!-- 动态渲染 -->
            </div>
            <div class="sidebar-footer">
                <button class="sidebar-add-cat" id="addCategoryBtn">➕ 添加分类</button>
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <button class="sidebar-add-cat solid" id="exportBtn" style="flex:1; padding:8px; font-size:14px;">📤 导出备份</button>
                    <button class="sidebar-add-cat solid" id="importBtn" style="flex:1; padding:8px; font-size:14px;">📥 导入备份</button>
                    <input type="file" id="importFileInput" accept=".json" style="display:none;">
                </div>
                <div style="margin-top: 6px; font-size: 11px; color: var(--text-light); text-align: center;">备份文件可存云端，换手机导入恢复</div>
            </div>
        </nav>

        <!-- ===== Cart Modal ===== -->
        <div class="cart-modal-overlay" id="cartModalOverlay">
            <div class="cart-modal">
                <div class="cart-modal-header">
                    <h3>🛒 许愿清单 <span class="count" id="cartCountLabel">0</span></h3>
                    <button class="cart-close-btn" id="cartCloseBtn">✕</button>
                </div>
                <div class="cart-list-wrap" id="cartListWrap">
                    <!-- 动态渲染 -->
                </div>
                <div class="cart-modal-footer">
                    <button class="btn btn-cancel" id="cartCancelBtn">清空</button>
                    <button class="btn btn-confirm" id="cartConfirmBtn">✨ 许愿下单</button>
                </div>
            </div>
        </div>

        <!-- ===== Add Item Modal ===== -->
        <div class="add-modal-overlay" id="addModalOverlay">
            <div class="add-modal">
                <h3>➕ 添加美食</h3>
                <div class="field">
                    <label>名称</label>
                    <input type="text" id="addName" placeholder="例如：汉堡王" maxlength="20">
                </div>
                <div class="field">
                    <label>地址</label>
                    <input type="text" id="addAddress" placeholder="例如：XX路88号">
                </div>
                <div class="field">
                    <label>选择图标</label>
                    <div class="emoji-picker" id="emojiPicker">
                        <button data-emoji="🍔">🍔</button><button data-emoji="🍕">🍕</button>
                        <button data-emoji="🍣">🍣</button><button data-emoji="🥩">🥩</button>
                        <button data-emoji="🍜">🍜</button><button data-emoji="🥗">🥗</button>
                        <button data-emoji="🍰">🍰</button><button data-emoji="🧋">🧋</button>
                        <button data-emoji="☕">☕</button><button data-emoji="🍦">🍦</button>
                        <button data-emoji="🍿">🍿</button><button data-emoji="🥜">🥜</button>
                        <button data-emoji="🍪">🍪</button><button data-emoji="🧁">🧁</button>
                    </div>
                </div>
                <div class="field">
                    <label>或上传图片</label>
                    <input type="file" id="addImageFile" accept="image/*">
                </div>
                <div class="modal-actions">
                    <button class="btn btn-cancel" id="addCancelBtn">取消</button>
                    <button class="btn btn-confirm" id="addConfirmBtn">添加</button>
                </div>
            </div>
        </div>

        <!-- ===== Add Category Modal ===== -->
        <div class="add-modal-overlay" id="addCatModalOverlay">
            <div class="add-modal">
                <h3>📂 添加分类</h3>
                <div class="field">
                    <label>分类名称</label>
                    <input type="text" id="addCatName" placeholder="例如：甜品" maxlength="10">
                </div>
                <div class="field">
                    <label>选择图标</label>
                    <div class="emoji-picker" id="catEmojiPicker">
                        <button data-emoji="🍰">🍰</button><button data-emoji="🍣">🍣</button>
                        <button data-emoji="🥘">🥘</button><button data-emoji="🍜">🍜</button>
                        <button data-emoji="🥗">🥗</button><button data-emoji="🧁">🧁</button>
                        <button data-emoji="🍦">🍦</button><button data-emoji="🥤">🥤</button>
                        <button data-emoji="🍿">🍿</button><button data-emoji="🍪">🍪</button>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-cancel" id="addCatCancelBtn">取消</button>
                    <button class="btn btn-confirm" id="addCatConfirmBtn">创建</button>
                </div>
            </div>
        </div>

        <!-- ===== Screenshot Preview ===== -->
        <div class="screenshot-preview-overlay" id="screenshotPreviewOverlay">
            <div class="screenshot-preview" id="screenshotPreview">
                <img id="screenshotImg" src="" alt="许愿单截图">
                <div class="preview-actions">
                    <button class="btn btn-close-preview" id="previewCloseBtn">关闭</button>
                    <button class="btn btn-download" id="previewDownloadBtn">💾 保存图片</button>
                </div>
            </div>
        </div>

        <!-- ===== Toast ===== -->
        <div class="toast" id="toast"></div>

    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  Data — 三个分类保留，选项全部清空
            // ============================================================
            const DEFAULT_CATEGORIES = [
                { id: 'cat_restaurant', name: '餐厅', emoji: '🍽️' },
                { id: 'cat_drink', name: '饮品', emoji: '🥤' },
                { id: 'cat_snack', name: '零食', emoji: '🍿' },
            ];

            const DEFAULT_ITEMS = {
                cat_restaurant: [],
                cat_drink: [],
                cat_snack: [],
            };

            // ============================================================
            //  State
            // ============================================================
            let state = {
                categories: [],
                items: {},
                cart: [],
                currentCategoryId: null,
                selectedEmoji: '🍔',
                selectedCatEmoji: '🍰',
                editingCategoryId: null,
            };

            // ============================================================
            //  DOM refs
            // ============================================================
            const $ = (sel) => document.querySelector(sel);
            const mainContent = $('#mainContent');
            const sidebar = $('#sidebar');
            const sidebarOverlay = $('#sidebarOverlay');
            const sidebarCategories = $('#sidebarCategories');
            const menuBtn = $('#menuBtn');
            const sidebarClose = $('#sidebarClose');
            const cartBtn = $('#cartBtn');
            const cartBadge = $('#cartBadge');
            const cartModalOverlay = $('#cartModalOverlay');
            const cartListWrap = $('#cartListWrap');
            const cartCountLabel = $('#cartCountLabel');
            const cartCloseBtn = $('#cartCloseBtn');
            const cartCancelBtn = $('#cartCancelBtn');
            const cartConfirmBtn = $('#cartConfirmBtn');
            const addModalOverlay = $('#addModalOverlay');
            const addName = $('#addName');
            const addAddress = $('#addAddress');
            const addImageFile = $('#addImageFile');
            const addCancelBtn = $('#addCancelBtn');
            const addConfirmBtn = $('#addConfirmBtn');
            const emojiPicker = $('#emojiPicker');
            const addCatModalOverlay = $('#addCatModalOverlay');
            const addCatName = $('#addCatName');
            const addCatCancelBtn = $('#addCatCancelBtn');
            const addCatConfirmBtn = $('#addCatConfirmBtn');
            const catEmojiPicker = $('#catEmojiPicker');
            const addCategoryBtn = $('#addCategoryBtn');
            const screenshotPreviewOverlay = $('#screenshotPreviewOverlay');
            const screenshotImg = $('#screenshotImg');
            const previewCloseBtn = $('#previewCloseBtn');
            const previewDownloadBtn = $('#previewDownloadBtn');
            const toast = $('#toast');
            const exportBtn = $('#exportBtn');
            const importBtn = $('#importBtn');
            const importFileInput = $('#importFileInput');

            // ============================================================
            //  Storage
            // ============================================================
            function loadState() {
                try {
                    const raw = localStorage.getItem('diancan_app_state');
                    if (raw) {
                        const saved = JSON.parse(raw);
                        state.categories = saved.categories || DEFAULT_CATEGORIES;
                        state.items = saved.items || {};
                        state.cart = saved.cart || [];
                        state.categories.forEach(cat => {
                            if (!state.items[cat.id]) state.items[cat.id] = [];
                        });
                        if (state.categories.length === 0) {
                            state.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
                            state.items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
                        }
                        state.currentCategoryId = state.categories[0]?.id || null;
                        return;
                    }
                } catch (e) { /* ignore */ }
                state.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
                state.items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
                state.cart = [];
                state.currentCategoryId = state.categories[0]?.id || null;
            }

            function saveState() {
                try {
                    localStorage.setItem('diancan_app_state', JSON.stringify({
                        categories: state.categories,
                        items: state.items,
                        cart: state.cart,
                    }));
                } catch (e) { /* ignore */ }
            }

            // ============================================================
            //  Utils
            // ============================================================
            function genId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            }

            function showToast(msg, duration = 1600) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => toast.classList.remove('show'), duration);
            }

            function getCategoryName(catId) {
                const cat = state.categories.find(c => c.id === catId);
                return cat ? cat.name : '未知';
            }

            function getItemById(itemId) {
                for (const catId of Object.keys(state.items)) {
                    const found = state.items[catId].find(it => it.id === itemId);
                    if (found) return found;
                }
                return null;
            }

            // ============================================================
            //  Render functions
            // ============================================================
            function renderMain() {
                if (!state.currentCategoryId) {
                    if (state.categories.length > 0) {
                        state.currentCategoryId = state.categories[0].id;
                    } else {
                        mainContent.innerHTML =
                            `<div class="empty-state"><span class="big-emoji">📭</span><p>还没有分类，点击左上角菜单<br>添加一个分类吧！</p></div>`;
                        return;
                    }
                }

                const cat = state.categories.find(c => c.id === state.currentCategoryId);
                if (!cat) {
                    if (state.categories.length > 0) {
                        state.currentCategoryId = state.categories[0].id;
                        renderMain();
                        return;
                    }
                    mainContent.innerHTML =
                        `<div class="empty-state"><span class="big-emoji">📭</span><p>还没有分类，点击左上角菜单<br>添加一个分类吧！</p></div>`;
                    return;
                }

                const items = state.items[cat.id] || [];
                const emoji = cat.emoji || '📁';

                let html = `
                    <div class="category-header">
                        <h2><span class="emoji">${emoji}</span> ${cat.name}</h2>
                        <button class="add-item-btn" data-action="addItem">+</button>
                    </div>
                `;

                if (items.length === 0) {
                    html +=
                        `<div class="empty-state"><span class="big-emoji">🍽️</span><p>这个分类还是空的<br>点击右上角 <strong>+</strong> 添加美食吧</p></div>`;
                } else {
                    html += `<div class="item-grid">`;
                    items.forEach(item => {
                        const imageHtml = item.image ?
                            `<img src="${item.image}" alt="${item.name}" loading="lazy">` :
                            `<span class="emoji-placeholder">${item.emoji || '🍽️'}</span>`;
                        const inCart = state.cart.includes(item.id);
                        html += `
                            <div class="item-card" data-item-id="${item.id}">
                                <div class="card-img" style="background: ${getColorForEmoji(item.emoji || '🍽️')}">
                                    ${imageHtml}
                                    <button class="img-upload-btn" data-action="uploadImage" data-item-id="${item.id}">
                                        📷<input type="file" accept="image/*" data-item-id="${item.id}">
                                    </button>
                                    <button class="card-del" data-action="deleteItem" data-item-id="${item.id}">✕</button>
                                </div>
                                <div class="card-body">
                                    <div class="card-name">${item.name}</div>
                                    <div class="card-address">${item.address || '暂无地址'}</div>
                                    <div class="card-actions">
                                        <button class="add-to-cart ${inCart ? 'added' : ''}" data-action="toggleCart" data-item-id="${item.id}">
                                            ${inCart ? '✓' : '+'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                mainContent.innerHTML = html;
                updateBadge();
            }

            function getColorForEmoji(emoji) {
                const colors = [
                    '#fce4d6', '#d5e8d0', '#f8d5d5', '#d5e0f0', '#f0e6d5',
                    '#d5f0e6', '#f5d5e6', '#e6d5f5', '#d5f5e6', '#f5e6d5',
                    '#d5e8f0', '#f0d5e6', '#e6f0d5', '#d5f0f0', '#f0e6d5',
                ];
                let hash = 0;
                for (let i = 0; i < emoji.length; i++) {
                    hash = emoji.charCodeAt(i) + ((hash << 5) - hash);
                }
                return colors[Math.abs(hash) % colors.length];
            }

            function renderSidebar() {
                let html = '';
                state.categories.forEach(cat => {
                    const count = (state.items[cat.id] || []).length;
                    const active = cat.id === state.currentCategoryId ? 'active' : '';
                    html += `
                        <button class="sidebar-cat ${active}" data-cat-id="${cat.id}" data-action="switchCategory">
                            <span class="cat-emoji">${cat.emoji || '📁'}</span> ${cat.name}
                            <span class="cat-count">${count}</span>
                            <span class="cat-del" data-action="deleteCategory" data-cat-id="${cat.id}">✕</span>
                        </button>
                    `;
                });
                sidebarCategories.innerHTML = html;
            }

            function renderCart() {
                const items = state.cart.map(id => getItemById(id)).filter(Boolean);
                const count = items.length;
                cartCountLabel.textContent = count;

                if (count === 0) {
                    cartListWrap.innerHTML =
                        `<div class="cart-empty"><span class="big-emoji">🛒</span><p>许愿清单还是空的<br>去添加一些美食吧！</p></div>`;
                    return;
                }

                let html = '';
                items.forEach(item => {
                    const emoji = item.emoji || '🍽️';
                    html += `
                        <div class="cart-item" data-item-id="${item.id}">
                            <span class="ci-emoji">${emoji}</span>
                            <div class="ci-info">
                                <div class="ci-name">${item.name}</div>
                                <div class="ci-addr">${item.address || '暂无地址'}</div>
                            </div>
                            <button class="ci-remove" data-action="removeFromCart" data-item-id="${item.id}">✕</button>
                        </div>
                    `;
                });
                cartListWrap.innerHTML = html;
                updateBadge();
            }

            function updateBadge() {
                const count = state.cart.length;
                cartBadge.textContent = count;
                if (count > 0) cartBadge.classList.add('show');
                else cartBadge.classList.remove('show');
            }

            // ============================================================
            //  Backup & Restore
            // ============================================================
            function exportData() {
                const data = {
                    categories: state.categories,
                    items: state.items,
                    cart: state.cart
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `许愿单备份_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('✅ 备份已导出，请保存到云端/微信');
            }

            function importData(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.categories || !data.items) {
                            showToast('❌ 备份文件格式无效');
                            return;
                        }
                        if (!confirm('导入将覆盖当前所有数据，确认继续吗？')) return;
                        state.categories = data.categories;
                        state.items = data.items;
                        state.cart = data.cart || [];
                        state.categories.forEach(cat => {
                            if (!state.items[cat.id]) state.items[cat.id] = [];
                        });
                        if (state.categories.length > 0) state.currentCategoryId = state.categories[0].id;
                        saveState();
                        renderMain();
                        renderSidebar();
                        updateBadge();
                        showToast('✅ 数据恢复成功！');
                        closeSidebar();
                    } catch (err) {
                        showToast('❌ 备份文件损坏或无效');
                    }
                };
                reader.readAsText(file);
            }

            // ============================================================
            //  Modal helpers
            // ============================================================
            function openModal(overlay) { overlay.classList.add('open'); }

            function closeModal(overlay) { overlay.classList.remove('open'); }

            function openCart() { renderCart();
                openModal(cartModalOverlay); }

            function closeCart() { closeModal(cartModalOverlay); }

            function openAddItem() {
                state.editingCategoryId = state.currentCategoryId;
                addName.value = '';
                addAddress.value = '';
                addImageFile.value = '';
                state.selectedEmoji = '🍔';
                emojiPicker.querySelectorAll('button').forEach(btn => {
                    btn.classList.toggle('selected', btn.dataset.emoji === '🍔');
                });
                openModal(addModalOverlay);
                setTimeout(() => addName.focus(), 300);
            }

            function closeAddItem() { closeModal(addModalOverlay); }

            function openAddCategory() {
                addCatName.value = '';
                state.selectedCatEmoji = '🍰';
                catEmojiPicker.querySelectorAll('button').forEach(btn => {
                    btn.classList.toggle('selected', btn.dataset.emoji === '🍰');
                });
                openModal(addCatModalOverlay);
                setTimeout(() => addCatName.focus(), 300);
            }

            function closeAddCategory() { closeModal(addCatModalOverlay); }

            function openSidebar() { renderSidebar();
                sidebar.classList.add('open');
                sidebarOverlay.classList.add('open'); }

            function closeSidebar() { sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('open'); }

            // ============================================================
            //  Event Handlers
            // ============================================================
            menuBtn.addEventListener('click', openSidebar);
            sidebarClose.addEventListener('click', closeSidebar);
            sidebarOverlay.addEventListener('click', closeSidebar);

            // 导出导入
            exportBtn.addEventListener('click', exportData);
            importBtn.addEventListener('click', () => importFileInput.click());
            importFileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    importData(e.target.files[0]);
                    e.target.value = '';
                }
            });

            sidebarCategories.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-action="switchCategory"]');
                if (btn) {
                    const catId = btn.dataset.catId;
                    if (catId && state.currentCategoryId !== catId) {
                        state.currentCategoryId = catId;
                        renderMain();
                        renderSidebar();
                        closeSidebar();
                        saveState();
                    }
                    return;
                }
                const del = e.target.closest('[data-action="deleteCategory"]');
                if (del) {
                    e.stopPropagation();
                    const catId = del.dataset.catId;
                    if (state.categories.length <= 1) { showToast('至少保留一个分类哦'); return; }
                    if (confirm(`确定要删除分类「${getCategoryName(catId)}」吗？`)) {
                        state.categories = state.categories.filter(c => c.id !== catId);
                        delete state.items[catId];
                        const allItemIds = Object.values(state.items).flat().map(it => it.id);
                        state.cart = state.cart.filter(id => allItemIds.includes(id));
                        if (state.currentCategoryId === catId) {
                            state.currentCategoryId = state.categories[0]?.id || null;
                        }
                        renderMain();
                        renderSidebar();
                        saveState();
                        showToast('已删除分类');
                    }
                }
            });

            addCategoryBtn.addEventListener('click', openAddCategory);
            addCatCancelBtn.addEventListener('click', closeAddCategory);
            addCatConfirmBtn.addEventListener('click', () => {
                const name = addCatName.value.trim();
                if (!name) { showToast('请输入分类名称'); return; }
                const emoji = state.selectedCatEmoji || '📁';
                const newCat = { id: 'cat_' + genId(), name, emoji };
                state.categories.push(newCat);
                state.items[newCat.id] = [];
                state.currentCategoryId = newCat.id;
                renderMain();
                renderSidebar();
                saveState();
                closeAddCategory();
                showToast(`已创建分类「${name}」`);
            });

            catEmojiPicker.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (btn) {
                    catEmojiPicker.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    state.selectedCatEmoji = btn.dataset.emoji;
                }
            });

            emojiPicker.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (btn) {
                    emojiPicker.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    state.selectedEmoji = btn.dataset.emoji;
                }
            });

            addCancelBtn.addEventListener('click', closeAddItem);
            addConfirmBtn.addEventListener('click', () => {
                const name = addName.value.trim();
                if (!name) { showToast('请输入名称'); return; }
                const address = addAddress.value.trim() || '暂无地址';
                const emoji = state.selectedEmoji || '🍽️';
                let image = '';
                const file = addImageFile.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        image = e.target.result;
                        doAddItem(name, address, emoji, image);
                    };
                    reader.readAsDataURL(file);
                } else {
                    doAddItem(name, address, emoji, image);
                }
            });

            function doAddItem(name, address, emoji, image) {
                const catId = state.editingCategoryId || state.currentCategoryId;
                if (!catId) { showToast('请先选择分类'); return; }
                const newItem = { id: 'item_' + genId(), name, address, emoji, image: image || '' };
                if (!state.items[catId]) state.items[catId] = [];
                state.items[catId].push(newItem);
                renderMain();
                renderSidebar();
                saveState();
                closeAddItem();
                showToast(`已添加「${name}」`);
            }

            mainContent.addEventListener('change', (e) => {
                const input = e.target.closest('input[type="file"]');
                if (input && input.closest('[data-action="uploadImage"]')) {
                    const file = input.files[0];
                    if (!file) return;
                    const itemId = input.dataset.itemId;
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const dataUrl = e.target.result;
                        for (const catId of Object.keys(state.items)) {
                            const item = state.items[catId].find(it => it.id === itemId);
                            if (item) {
                                item.image = dataUrl;
                                saveState();
                                renderMain();
                                showToast('图片已更新');
                                break;
                            }
                        }
                    };
                    reader.readAsDataURL(file);
                }
            });

            mainContent.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-action="uploadImage"]');
                if (btn) {
                    const input = btn.querySelector('input[type="file"]');
                    if (input) input.click();
                }
                const del = e.target.closest('[data-action="deleteItem"]');
                if (del) {
                    e.stopPropagation();
                    const itemId = del.dataset.itemId;
                    const item = getItemById(itemId);
                    if (!item) return;
                    if (confirm(`确定要删除「${item.name}」吗？`)) {
                        for (const catId of Object.keys(state.items)) {
                            const idx = state.items[catId].findIndex(it => it.id === itemId);
                            if (idx !== -1) {
                                state.items[catId].splice(idx, 1);
                                state.cart = state.cart.filter(id => id !== itemId);
                                renderMain();
                                renderSidebar();
                                saveState();
                                showToast(`已删除「${item.name}」`);
                                break;
                            }
                        }
                    }
                }
                const cartToggle = e.target.closest('[data-action="toggleCart"]');
                if (cartToggle) {
                    const itemId = cartToggle.dataset.itemId;
                    const idx = state.cart.indexOf(itemId);
                    if (idx === -1) {
                        state.cart.push(itemId);
                        showToast('已加入许愿清单 ✨');
                    } else {
                        state.cart.splice(idx, 1);
                        showToast('已移除');
                    }
                    renderMain();
                    renderSidebar();
                    updateBadge();
                    saveState();
                }
                const addItemBtn = e.target.closest('[data-action="addItem"]');
                if (addItemBtn) openAddItem();
            });

            cartBtn.addEventListener('click', openCart);
            cartCloseBtn.addEventListener('click', closeCart);
            cartCancelBtn.addEventListener('click', () => {
                if (state.cart.length === 0) return;
                if (confirm('确定要清空许愿清单吗？')) {
                    state.cart = [];
                    renderCart();
                    renderMain();
                    updateBadge();
                    saveState();
                    showToast('已清空');
                }
            });

            cartListWrap.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-action="removeFromCart"]');
                if (btn) {
                    const itemId = btn.dataset.itemId;
                    state.cart = state.cart.filter(id => id !== itemId);
                    renderCart();
                    renderMain();
                    updateBadge();
                    saveState();
                    showToast('已移除');
                }
            });

            cartConfirmBtn.addEventListener('click', async () => {
                if (state.cart.length === 0) { showToast('许愿清单是空的，先添加一些美食吧'); return; }
                try {
                    cartConfirmBtn.textContent = '⏳ 生成中...';
                    cartConfirmBtn.disabled = true;
                    const cartItems = state.cart.map(id => getItemById(id)).filter(Boolean);
                    const container = document.createElement('div');
                    container.style.cssText = `
                        padding: 32px 28px; background: #f0f7f0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
                        max-width: 480px; border-radius: 20px; box-shadow: 0 8px 40px rgba(0,0,0,0.06);
                    `;
                    container.innerHTML = `
                        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;border-bottom:2px solid rgba(107,168,142,0.15);padding-bottom:14px;">
                            <span style="font-size:28px;">✨</span>
                            <div>
                                <div style="font-size:24px;font-weight:400;color:#2d3e35;font-family: 'Patrick Hand', 'Comic Sans MS', cursive, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
                                    小祖宗の许愿单
                                </div>
                                <div style="font-size:13px;color:#6a7f74;">${new Date().toLocaleString()}</div>
                            </div>
                            <span style="margin-left:auto;background:#6ba88e;color:#fff;font-size:14px;padding:2px 14px;border-radius:20px;">${cartItems.length} 件</span>
                        </div>
                        <div style="display:flex;flex-direction:column;gap:10px;">
                            ${cartItems.map(item => `
                                <div style="display:flex;align-items:center;gap:14px;background:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 2px 8px rgba(107,168,142,0.06);">
                                    <span style="font-size:32px;width:44px;text-align:center;">${item.emoji || '🍽️'}</span>
                                    <div style="flex:1;min-width:0;">
                                        <div style="font-size:16px;font-weight:500;color:#2d3e35;">${item.name}</div>
                                        <div style="font-size:12px;color:#6a7f74;display:flex;align-items:center;gap:4px;">
                                            <span>📍</span> ${item.address || '暂无地址'}
                                        </div>
                                    </div>
                                    <span style="color:#6ba88e;font-size:18px;">✓</span>
                                </div>
                            `).join('')}
                        </div>
                        <div style="margin-top:18px;text-align:center;font-size:16px;color:#6a7f74;border-top:1px solid rgba(107,168,142,0.08);padding-top:14px;font-family: 'Patrick Hand', 'Comic Sans MS', cursive, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
                            ✨ 马上为小仙女实现 ✨
                        </div>
                    `;
                    document.body.appendChild(container);
                    const canvas = await html2canvas(container, { scale: 2, useCORS: true, backgroundColor: '#f0f7f0',
                        logging: false, width: container.scrollWidth, height: container.scrollHeight });
                    document.body.removeChild(container);
                    screenshotImg.src = canvas.toDataURL('image/png');
                    openModal(screenshotPreviewOverlay);
                    closeCart();
                    showToast('🎉 许愿完成！');
                } catch (err) {
                    console.error(err);
                    showToast('生成截图失败，请重试');
                } finally {
                    cartConfirmBtn.textContent = '✨ 许愿下单';
                    cartConfirmBtn.disabled = false;
                }
            });

            previewCloseBtn.addEventListener('click', () => closeModal(screenshotPreviewOverlay));
            previewDownloadBtn.addEventListener('click', () => {
                const link = document.createElement('a');
                link.download = `许愿单_${new Date().toISOString().slice(0,10)}.png`;
                link.href = screenshotImg.src;
                link.click();
                showToast('💾 图片已保存');
            });

            screenshotPreviewOverlay.addEventListener('click', (e) => {
                if (e.target === screenshotPreviewOverlay) closeModal(screenshotPreviewOverlay);
            });
            cartModalOverlay.addEventListener('click', (e) => {
                if (e.target === cartModalOverlay) closeCart();
            });
            addModalOverlay.addEventListener('click', (e) => {
                if (e.target === addModalOverlay) closeAddItem();
            });
            addCatModalOverlay.addEventListener('click', (e) => {
                if (e.target === addCatModalOverlay) closeAddCategory();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (screenshotPreviewOverlay.classList.contains('open')) closeModal(screenshotPreviewOverlay);
                    else if (cartModalOverlay.classList.contains('open')) closeCart();
                    else if (addModalOverlay.classList.contains('open')) closeAddItem();
                    else if (addCatModalOverlay.classList.contains('open')) closeAddCategory();
                    else if (sidebar.classList.contains('open')) closeSidebar();
                }
            });

            // ============================================================
            //  Init
            // ============================================================
            loadState();
            renderMain();
            renderSidebar();
            updateBadge();
            if (state.currentCategoryId && !state.categories.find(c => c.id === state.currentCategoryId)) {
                state.currentCategoryId = state.categories[0]?.id || null;
                renderMain();
            }
            console.log('✨ 小祖宗の许愿单已启动！ (分类为空，等你添加)');

        })();
    </script>
</body>
</html>
